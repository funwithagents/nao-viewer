# Continuous integration — specs/ci.md.
#
# Three jobs side by side on GitHub's hosted runners, on every pull request and push to main:
# `check` (lint, format, types), `fast-tier` (tests/, with a real headless viewer on the mock
# NAOqi; on Linux and macOS) and `e2e-nao-sim` (tests-e2e/ against a real NAOqi 2.1 that
# nao-sim builds on a Linux runner; headless and windowed). Matrix entries run side by side
# too, and none waits on another. No secret is needed.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesa's EGL: a headless viewer renders offscreen with no display and no GPU (specs/api.md,
  # "Headless"). libopengl0 is what PyOpenGL loads; the runner image may have it already.
  APT_GL: libegl1 libopengl0 libgl1-mesa-dri
  # A virtual X display, and Mesa's GLX for MuJoCo's window (GLFW), for the windowed live run.
  APT_WINDOW: xvfb xauth libgl1 libglx-mesa0
  # The nao-sim commit whose docker/ recipes build the live job's NAOqi; bumped on purpose.
  NAO_SIM_REF: d4cb4e82f947e09b352789e3134ae630f06d5e84

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (against the lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check (specs/ and plans/ are excluded in pyproject.toml)
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright

  fast-tier:
    name: fast tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Linux, CI's own target, and macOS (Apple Silicon), where nao-viewer is developed: the
      # macOS qi wheel, CGL offscreen rendering under plain python. One OS failing leaves the
      # other running.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: System packages (offscreen OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_GL
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (against the lock)
        run: uv sync --locked
      - name: Fast tier
        env:
          # On Linux the in-process renderer test renders through EGL too (MuJoCo's Linux
          # default is GLFW, which needs a display), and a runner without offscreen GL fails
          # the job instead of skipping the headless viewer tests. macOS runners are VMs with
          # no GPU: MuJoCo's CGL asks for an accelerated pixel format and gets none, so the two
          # GL tests skip there, as expected (specs/ci.md).
          MUJOCO_GL: ${{ runner.os == 'Linux' && 'egl' || '' }}
          NAO_VIEWER_REQUIRE_OFFSCREEN_GL: ${{ runner.os == 'Linux' && '1' || '' }}
        run: uv run pytest -rs

  e2e-nao-sim:
    name: live tier, nao-sim NAOqi 2.1, ${{ matrix.viewer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Each entry on its own runner with its own NAOqi. headless: the tier's default, the
      # mirror test skips. window: NAO_VIEWER_E2E_WINDOW=1 under a virtual X display, so the
      # windowed loop and the mirror test run too. macOS runners have no Docker, so no
      # nao-sim: the live tier is Linux only (specs/ci.md).
      fail-fast: false
      matrix:
        viewer: [headless, window]
    steps:
      - uses: actions/checkout@v7
      - name: nao-sim (its docker/ recipes and image tooling, at the pinned commit)
        uses: actions/checkout@v7
        with:
          repository: funwithagents/nao-sim
          ref: ${{ env.NAO_SIM_REF }}
          path: nao-sim
      - name: System packages (offscreen OpenGL, and a virtual display for the window entry)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_GL ${{ matrix.viewer == 'window' && '$APT_WINDOW' || '' }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            nao-sim/uv.lock
      # nao-sim's images (NAOqi 2.1 and tts), saved with `docker save` in this repository's
      # Actions cache, keyed on the nao-sim pin they are built from. On a miss, nao-sim fetches
      # Aldebaran's files only to build them, as it does on a user's machine; the files are
      # never cached. The images contain Aldebaran's software: a cache only this repository's
      # workflows read, never a registry (specs/ci.md).
      - name: nao-sim images (restore)
        id: images
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/nao-sim-images.tar
          key: nao-sim-images-2.1-${{ env.NAO_SIM_REF }}
      - name: Load the cached images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/nao-sim-images.tar"
      - name: Build and verify the images (nao-sim fetch-and-build-images)
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          uv run --project nao-sim --locked nao-sim fetch-and-build-images 2.1
          docker save -o "$RUNNER_TEMP/nao-sim-images.tar" nao-sim/naoqi:2.1.4.13 nao-sim/tts:dev
      # Saved right after the build, not at the end of the job, so a failing live tier
      # doesn't build again on the next run.
      - name: nao-sim images (save)
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nao-sim-images.tar
          key: ${{ steps.images.outputs.cache-primary-key }}
      - name: Start NAOqi 2.1
        run: docker compose -f nao-sim/docker/compose.yaml --profile 2.1 up -d --wait --no-build
      - name: Sync (against the lock)
        run: uv sync --locked
      - name: Live tier
        env:
          NAOQI_URL: tcp://127.0.0.1:9559
          NAO_VIEWER_E2E_WINDOW: ${{ matrix.viewer == 'window' && '1' || '' }}
        # Warnings and errors print live, the viewer process's own among them. The window entry
        # runs under xvfb-run, which gives the viewer windows an X display.
        run: |
          pytest="uv run pytest tests-e2e -rs -o log_cli=true --log-cli-level=WARNING"
          if [ "${{ matrix.viewer }}" = window ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" $pytest
          else
            $pytest
          fi
      - name: NAOqi logs
        if: failure()
        run: docker compose -f nao-sim/docker/compose.yaml --profile 2.1 logs --tail 300
